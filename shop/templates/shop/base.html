{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Kinoka{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'shop/css/style.css' %}">
</head>
<body>
    <header class="header">
        <div class="header__inner">
            <a href="{% url 'home' %}" class="logo">Kinoka</a>
            <button class="catalog-btn">☰ Каталог</button>
            <form action="{% url 'home' %}" method="get" class="search-form">
                <input type="text" name="q" class="search" placeholder="Искать товары..." value="{{ request.GET.q }}">
            </form>
            <div class="header__icons">
                <a href="{% url 'favorites_list' %}" class="icon">♡</a>
                <a href="{% url 'cart_detail' %}" class="icon">🛒</a>
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>© 2026 Kinoka. Все права защищены.</p>
    </footer>
</body>
</html>
